<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AM5 Clothing — Boutique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
    <a href="#accueil" class="brand">
      <span class="brand-title">AM5</span>
      <span class="brand-sub">Clothing</span>
    </a>
    <button class="icon-btn cart-btn" id="openCartBtn" aria-label="Panier">
      🛒 <span class="cart-badge" id="cartCount">0</span>
    </button>
  </header>

  <main class="container" id="accueil">
    <section class="products-grid" id="productsGrid"></section>

    <section class="info-section" id="favorisSection" style="display: none;">
      <h2>Favoris</h2>
      <p id="favoritesText">Aucun article en favoris pour le moment.</p>
    </section>

    <section class="info-section" id="profilSection" style="display: none;">
      <h2>AM5 Clothing</h2>
      <p>Collection Tricot Henley en coton — Livraison partout au Maroc.</p>
    </section>
  </main>

  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-header">
      <h3>Votre Panier</h3>
      <button class="close-btn" id="closeCartBtn">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total :</span>
        <strong id="cartTotal">0 DH</strong>
      </div>
      <button class="checkout-btn" id="checkoutBtn">Commander</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="accueil">
      <span class="nav-icon">🏠</span>
      <span>Accueil</span>
    </button>
    <button class="nav-item" data-tab="boutique">
      <span class="nav-icon">🛍️</span>
      <span>Boutique</span>
    </button>
    <button class="nav-item" data-tab="favoris">
      <span class="nav-icon">♡</span>
      <span>Favoris</span>
    </button>
    <button class="nav-item" data-tab="profil">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
